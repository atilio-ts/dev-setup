# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# True color
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",*:Tc"

# Reduce escape delay (important for neovim)
set -sg escape-time 10

# Focus events (required for neovim autoread)
set -g focus-events on

# Start indices at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Scrollback
set -g history-limit 50000

# Vi keys in copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Splits — retain current path
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style, no prefix)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Status bar — Catppuccin Mocha palette
set -g status-position bottom
set -g status-style "bg=#1e1e2e fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#a6e3a1] %H:%M #[fg=#89b4fa]%d/%m/%Y "
set -g status-left-length 30
set -g window-status-current-style "bg=#313244,fg=#89b4fa,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g window-status-separator ""
